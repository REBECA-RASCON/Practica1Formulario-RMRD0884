<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion </title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
  <header>
    <h1>MiTienda</h1>
  </header>

  <main>
    <form id="formLogin" class="tarjeta" novalidate>
      <h2>Inicia sesion</h2>

      <div id="mensaje" class="mensaje" role="alert" hidden></div>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="clara@gmail.com" required>

      <label for="password">Contrasena</label>
      <input type="password" id="password" name="password" required>

      <div class="botones">
        <button type="submit" class="btn">Entrar</button>
        <button type="reset" class="btn btn-secundario">Limpiar</button>
      </div>

      <p class="enlaces">
        <a href="registro.html">Aun no tienes cuenta? Registrate aqui</a><br>
        <a href="index.html">Regresar a la pagina principal</a>
      </p>
    </form>
  </main>

  <footer>
    <p>Proyecto de practica - no es una tienda real</p>
  </footer>

  <script>
    const form = document.getElementById("formLogin");
    const mensaje = document.getElementById("mensaje");

    function mostrar(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = "mensaje " + tipo;
      mensaje.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensaje.hidden = true;

      const email = form.email.value.trim();
      const password = form.password.value;

      if (!email || !password) {
        mostrar("Escribe tu email y tu contrasena.", "error");
        return;
      }

      try {
        const resp = await fetch("login.php", {
          method: "POST",
          body: new FormData(form)
        });
        const datos = await resp.json();

        if (datos.ok) {
          mostrar("Bienvenido, entrando...", "exito");
          window.location.href = "bienvenida.php";
        } else {
          mostrar(datos.mensaje, "error");
          form.password.value = "";
          form.password.focus();
        }
      } catch (err) {
        mostrar("No se pudo conectar con el servidor. Revisa que PHP y MySQL esten encendidos.", "error");
      }
    });
  </script>
</body>
</html>
